name: Sync & Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync content from Myronide/pureline-style
        run: npm run sync

      - name: Apply cached translations (instant, no model)
        run: npm run translate:docs -- --cache-only

      - name: Commit content changes
        if: github.event_name != 'push'
        run: |
          git add -A src/content src/content-i18n scripts/translation-cache
          # meta.json changes on every run, so only real content changes count
          if git diff --cached --quiet -- . ':!src/content/meta.json'; then
            git reset --quiet
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Pureline content"
          git push

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
